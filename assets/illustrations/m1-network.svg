<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img" aria-labelledby="t d"><title id="t">M1 本地接管的五个阶段</title><desc id="d">从 EasyLink 配网，到绕过路由器 DNS 的请求被发现，再到定向处理、激活与数据上报</desc><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#1d1d1f}.sub{fill:#5e6777;font-size:17px}.label{font-size:21px;font-weight:700}.node{fill:white;stroke:#b9cde6;stroke-width:2}.accent{fill:#e7f2ff;stroke:#0071e3;stroke-width:2}.line{stroke:#0071e3;stroke-width:4;fill:none;stroke-linecap:round}.ghost{stroke:#c2cbd8;stroke-dasharray:8 7;stroke-width:3;fill:none}@keyframes flow{to{stroke-dashoffset:-60}}.moving{stroke-dasharray:13 11;animation:flow 3.5s linear infinite}@media(prefers-reduced-motion:reduce){.moving{animation:none}}</style><rect width="1120" height="540" rx="28" fill="#f6f9fd"/><text x="52" y="63" font-size="32" font-weight="700">从连上 Wi-Fi，到数据真正进来</text><text x="52" y="96" class="sub">原创概念图 · 地址和设备身份已匿名化</text><rect x="52" y="146" width="255" height="112" rx="17" class="node"/><text x="84" y="192" class="label">悟空 M1</text><text x="84" y="224" class="sub">已关联 Wi-Fi / DHCP 成功</text><rect x="444" y="146" width="290" height="112" rx="17" class="node"/><text x="475" y="190" class="label">公共 DNS</text><text x="475" y="224" class="sub">固件主动查询原厂域名</text><rect x="850" y="146" width="214" height="112" rx="17" class="node"/><text x="878" y="190" class="label">原厂云端</text><text x="878" y="224" class="sub">已不可用</text><path d="M307 200H437" class="line moving"/><path d="M735 200H842" class="ghost"/><path d="M878 178L1036 236 M1036 178L878 236" stroke="#d35c56" stroke-width="3" opacity=".45"/><path d="M180 264V369H445" class="line moving"/><rect x="446" y="324" width="286" height="112" rx="17" class="accent"/><text x="474" y="370" class="label">定向 DNS 应答</text><text x="474" y="406" class="sub">仅针对 M1 / 指定域名</text><path d="M735 379H842" class="line moving"/><rect x="850" y="324" width="214" height="112" rx="17" class="accent"/><text x="874" y="367" class="label">本地服务</text><text x="874" y="400" class="sub">激活 + TCP 上报</text><text x="52" y="497" class="sub">虚线：最初失效路径　蓝线：本地接管后恢复的数据路径　此图不表示真实网络地址或连接记录</text></svg>