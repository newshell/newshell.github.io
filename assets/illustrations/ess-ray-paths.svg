<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc"><title id="title">三种空域跳跃路线</title><desc id="desc">固定步长、距离图大步跳跃以及SparseLeap区间采样的概念动画</desc><style>text{font:20px system-ui,-apple-system,sans-serif;fill:#1d1d1f}.small{font-size:15px;fill:#626873}.cell{fill:#f0f3f8;stroke:#d4deeb}.active{fill:#5b9fe8}.ray{stroke:#0071e3;stroke-width:4;stroke-linecap:round}.node{fill:#ff8d45}@keyframes travel{0%{transform:translateX(0)}100%{transform:translateX(810px)}}@keyframes pausejump{0%,20%{transform:translateX(0)}22%,50%{transform:translateX(324px)}52%,75%{transform:translateX(567px)}77%,100%{transform:translateX(810px)}}.dot1{animation:travel 7s linear infinite}.dot2{animation:pausejump 7s steps(1,end) infinite}.dot3{animation:pausejump 7s steps(1,end) infinite}@media(prefers-reduced-motion:reduce){.dot1,.dot2,.dot3{animation:none;transform:translateX(460px)}}</style><rect width="1080" height="520" rx="26" fill="#f8fafc"/><text x="50" y="55" font-size="26" font-weight="700">同一条光线，三种采样路径</text><text x="50" y="85" class="small">原创概念动画 · 非论文性能数据</text><g transform="translate(48 110)"><text y="32">固定步长 Ray Marching</text><text y="178">Distance Map</text><text y="324">SparseLeap</text><g transform="translate(0 48)"><rect width="960" height="76" rx="15" fill="#fff"/><g transform="translate(30 13)"><rect width="810" height="50" rx="9" fill="#f0f3f8"/><rect x="320" width="90" height="50" fill="#92bee9"/><rect x="570" width="125" height="50" fill="#92bee9"/><path d="M0 25H810" stroke="#c4d2e4" stroke-width="2" stroke-dasharray="5 10"/><g class="dot1"><circle cx="0" cy="25" r="9" fill="#e9773d"/></g></g></g><g transform="translate(0 194)"><rect width="960" height="76" rx="15" fill="#fff"/><g transform="translate(30 13)"><rect width="810" height="50" rx="9" fill="#f0f3f8"/><rect x="320" width="90" height="50" fill="#92bee9"/><rect x="570" width="125" height="50" fill="#92bee9"/><path d="M0 25H810" stroke="#c4d2e4" stroke-width="2" stroke-dasharray="5 10"/><g class="dot2"><circle cx="0" cy="25" r="9" fill="#0071e3"/></g></g></g><g transform="translate(0 340)"><rect width="960" height="76" rx="15" fill="#fff"/><g transform="translate(30 13)"><rect width="810" height="50" rx="9" fill="#f0f3f8"/><rect x="320" width="90" height="50" fill="#3f9fba" opacity=".7"/><rect x="570" width="125" height="50" fill="#3f9fba" opacity=".7"/><path d="M320 58V-6M410 58V-6M570 58V-6M695 58V-6" stroke="#0071e3" stroke-width="2" stroke-dasharray="4 4"/><g class="dot3"><circle cx="0" cy="25" r="9" fill="#0071e3"/></g></g></g></g><text x="49" y="499" class="small">蓝色区域代表非空体数据；橙色 / 蓝色圆点为光线位置，仅演示算法思路</text></svg>