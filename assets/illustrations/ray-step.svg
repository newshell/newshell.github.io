<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="title desc"><title id="title">Sample distance and accumulated opacity</title><desc id="desc">Illustrative ray sampling with near and far sample spacing. This diagram uses no measured data.</desc><rect width="960" height="370" fill="#0b1723"/><g stroke="#284457" opacity=".65"><path d="M30 65H930M30 165H930M30 265H930M30 350H930"/></g><g fill="#a3b7c5" font-size="21" font-family="ui-monospace,monospace"><text x="50" y="56">RAY / fixed path length</text><text x="50" y="141">COARSE Δ</text><text x="50" y="241">FINE Δ/2</text><text x="735" y="334">ALPHA: 1 − exp(−σΔ)</text></g><g stroke="#66dfd0" stroke-width="4" stroke-linecap="round"><path d="M220 115H845M220 215H845"/></g><g fill="#66dfd0"><circle cx="240" cy="115" r="9"/><circle cx="390" cy="115" r="9"/><circle cx="540" cy="115" r="9"/><circle cx="690" cy="115" r="9"/><circle cx="840" cy="115" r="9"/><circle cx="240" cy="215" r="7"/><circle cx="315" cy="215" r="7"/><circle cx="390" cy="215" r="7"/><circle cx="465" cy="215" r="7"/><circle cx="540" cy="215" r="7"/><circle cx="615" cy="215" r="7"/><circle cx="690" cy="215" r="7"/><circle cx="765" cy="215" r="7"/><circle cx="840" cy="215" r="7"/></g><text x="48" y="334" fill="#82a0b2" font-size="16" font-family="monospace">SYNTHETIC CONCEPT / NOT BENCHMARK DATA</text></svg>