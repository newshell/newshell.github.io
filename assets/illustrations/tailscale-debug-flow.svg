<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Endpoint 发现到直连路径选择的四个独立环节</title><desc id="desc">先发现本机候选端点，再向控制面发布，对端收到分发内容后，双方进行 UDP 探测，最后才可确认是否建立直连。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" stroke="#0071e3" stroke-width="1.5" fill="none"/></marker></defs>
<rect width="1200" height="530" rx="22" fill="url(#bg)"/><g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="50" y="57" fill="#0071e3" font-size="18" font-weight="700">ENDPOINT / DEBUG PIPELINE</text>
<text x="50" y="87" fill="#6e6e73" font-size="15">四个步骤需要各自的证据，不能用一个日志字段替代全部验证</text>
<g transform="translate(35 158)"><rect width="262" height="232" rx="20" fill="#fff" stroke="#c9d5e4" stroke-width="2"/><rect x="23" y="22" width="56" height="56" rx="15" fill="#e8f2ff"/><text x="51" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#0071e3">1</text><text x="23" y="118" fill="#1d1d1f" font-size="23" font-weight="700">发现</text><text x="23" y="149" fill="#6e6e73" font-size="16">本地 / WAN / STUN</text><path d="M23 181H234" stroke="#e0e7ee"/><text x="23" y="210" fill="#0071e3" font-size="15">证据：候选地址存在</text></g>
<g transform="translate(325 158)"><rect width="262" height="232" rx="20" fill="#fff" stroke="#c9d5e4" stroke-width="2"/><rect x="23" y="22" width="56" height="56" rx="15" fill="#e8f2ff"/><text x="51" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#0071e3">2</text><text x="23" y="118" fill="#1d1d1f" font-size="23" font-weight="700">发布</text><text x="23" y="149" fill="#6e6e73" font-size="16">客户端 → 控制服务器</text><path d="M23 181H234" stroke="#e0e7ee"/><text x="23" y="210" fill="#0071e3" font-size="15">证据：提交被处理</text></g>
<g transform="translate(615 158)"><rect width="262" height="232" rx="20" fill="#fff" stroke="#c9d5e4" stroke-width="2"/><rect x="23" y="22" width="56" height="56" rx="15" fill="#e8f2ff"/><text x="51" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#0071e3">3</text><text x="23" y="118" fill="#1d1d1f" font-size="23" font-weight="700">分发</text><text x="23" y="149" fill="#6e6e73" font-size="16">控制服务器 → Peer</text><path d="M23 181H234" stroke="#e0e7ee"/><text x="23" y="210" fill="#0071e3" font-size="15">证据：对端已收到</text></g>
<g transform="translate(905 158)"><rect width="262" height="232" rx="20" fill="#fff" stroke="#c9d5e4" stroke-width="2"/><rect x="23" y="22" width="56" height="56" rx="15" fill="#e8f2ff"/><text x="51" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#0071e3">4</text><text x="23" y="118" fill="#1d1d1f" font-size="23" font-weight="700">探测与选择</text><text x="23" y="149" fill="#6e6e73" font-size="16">双向 UDP / 最优路径</text><path d="M23 181H234" stroke="#e0e7ee"/><text x="23" y="210" fill="#0071e3" font-size="15">证据：direct / relay</text></g>
<path d="M297 270H321M587 270H611M877 270H901" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="83" y="425" width="1034" height="54" rx="14" fill="#e8f2ff"/><text x="600" y="458" text-anchor="middle" fill="#0071e3" font-size="17" font-weight="650">发现端点 ≠ 已发布 ≠ 对端收到 ≠ UDP 可达</text>
<text x="48" y="511" fill="#86868b" font-size="12">SCHEMATIC ONLY · NO PRIVATE LOGS OR NETWORK ADDRESSES</text></g></svg>