<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Two different transfer-function pipelines</title><desc id="desc">Concept comparison of aggregating a scalar field before a transfer function and coloring individual Gaussians before compositing.</desc><rect width="960" height="410" fill="#0b1723"/><g font-family="ui-monospace,monospace" font-size="19"><text x="42" y="46" fill="#d1e9ed">A / field first</text><text x="42" y="249" fill="#d1e9ed">B / appearance first</text></g><g stroke="#4b7183" stroke-width="2" fill="#172b39"><rect x="40" y="69" width="215" height="87" rx="5"/><rect x="354" y="69" width="220" height="87" rx="5"/><rect x="682" y="69" width="220" height="87" rx="5"/><rect x="40" y="267" width="215" height="87" rx="5"/><rect x="354" y="267" width="220" height="87" rx="5"/><rect x="682" y="267" width="220" height="87" rx="5"/></g><g fill="#b7d6de" font-family="ui-monospace,monospace" font-size="20" text-anchor="middle"><text x="148" y="116">Gaussian field</text><text x="464" y="116">scalar f(x)</text><text x="792" y="116">TF then integral</text><text x="148" y="316">Gaussian params</text><text x="464" y="316">per-Gaussian RGBA</text><text x="792" y="316">screen compositing</text></g><g stroke="#66dfd0" stroke-width="3" fill="none"><path d="M263 114H341l-10 -8m10 8-10 8M582 114H666l-11 -8m11 8-11 8M263 311H341l-10 -8m10 8-10 8M582 311H666l-11 -8m11 8-11 8"/></g><text x="42" y="395" fill="#91abba" font-family="monospace" font-size="15">TF(aggregate) generally differs from aggregate(TF) / illustrative only</text></svg>