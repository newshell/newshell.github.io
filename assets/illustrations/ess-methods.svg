<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 480" role="img" aria-labelledby="t d"><title id="t">Distance maps 与 SparseLeap 处理流程比较</title><desc id="d">距离图保留空间查询，SparseLeap用光栅化预先生成像素射线区间</desc><style>text{font:18px system-ui,sans-serif;fill:#1d1d1f}.sub{font-size:15px;fill:#616871}.label{font-weight:700;font-size:24px}.box{fill:#fff;stroke:#cbd8e6;stroke-width:2}.accent{fill:#e8f2ff;stroke:#0071e3;stroke-width:2}.ar{fill:none;stroke:#0071e3;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0071e3"/></marker></defs><rect width="1050" height="480" rx="24" fill="#f8fafc"/><text x="45" y="48" class="label">两种路线：距离查询 vs. 预先生成区间</text><text x="45" y="76" class="sub">原创概念图；表示研究方法的主要计算流，不对应特定实现代码</text><g transform="translate(45 110)"><text x="0" y="16" font-weight="700">Distance Maps · 查询阶段</text><rect class="box" x="0" y="48" width="190" height="85" rx="14"/><text x="38" y="81">体数据 + TF</text><text x="38" y="108" class="sub">定义空 / 非空</text><path class="ar" d="M196 90H235"/><rect class="accent" x="240" y="48" width="210" height="85" rx="14"/><text x="281" y="81">距离图</text><text x="256" y="108" class="sub">查询安全跳跃距离</text><path class="ar" d="M455 90H490"/><rect class="box" x="495" y="48" width="450" height="85" rx="14"/><text x="608" y="81">Ray Casting</text><text x="563" y="108" class="sub">行进时查询距离并跨越空区</text><text x="0" y="192" font-weight="700">SparseLeap · 前置光栅化阶段</text><rect class="box" x="0" y="224" width="190" height="85" rx="14"/><text x="31" y="258">有效区域包围盒</text><text x="42" y="283" class="sub">细粒度空间包围</text><path class="ar" d="M196 266H235"/><rect class="accent" x="240" y="224" width="210" height="85" rx="14"/><text x="276" y="258">GPU 光栅化</text><text x="260" y="283" class="sub">每像素区间列表</text><path class="ar" d="M455 266H490"/><rect class="box" x="495" y="224" width="450" height="85" rx="14"/><text x="608" y="258">Ray Casting</text><text x="547" y="283" class="sub">只对已标记的非空区间采样</text></g><text x="45" y="458" class="sub">方法边界：SparseLeap 仍需区间生成代价；距离图仍需维护更新开销</text></svg>