<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Metadata Replay 与 Full Replay</title><desc id="desc">将图形 API 状态检查与完整 GPU 执行拆分为两种回放模式</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#263640"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><g opacity=".12" stroke="#9eb6c5"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/></g><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="76" y="76" fill="#9cb6a5" font-size="17" letter-spacing="4">CODIE LAB / GRAPHICS DEBUGGING</text><text x="76" y="151" fill="#f3f4ef" font-size="44" font-weight="700">别为了看状态，把 GPU 再跑一遍</text><text x="78" y="198" fill="#aab9c2" font-size="20">Metadata Replay：状态检查与真实执行，应该是两种工作</text></g><g filter="url(#shadow)" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="88" y="275" width="470" height="225" rx="18" fill="#1e3c36" stroke="#81b89b" stroke-width="2"/><text x="323" y="320" fill="#d9eee0" font-size="26" font-weight="700" text-anchor="middle">METADATA REPLAY</text><text x="323" y="350" fill="#9fc3ae" font-size="14" text-anchor="middle">状态 / 对象 / Shader / Binding</text><g fill="#a6cfb3"><rect x="140" y="390" width="80" height="45" rx="7"/><rect x="240" y="390" width="80" height="45" rx="7"/><rect x="340" y="390" width="80" height="45" rx="7"/><rect x="440" y="390" width="65" height="45" rx="7"/></g><g fill="#20372e" font-size="13" text-anchor="middle"><text x="180" y="418">State</text><text x="280" y="418">Program</text><text x="380" y="418">Uniform</text><text x="472" y="418">FBO</text></g><text x="323" y="470" fill="#a9c7b7" font-size="14" text-anchor="middle">跳过可安全省略的 GPU 内容生产</text><rect x="642" y="275" width="470" height="225" rx="18" fill="#263846" stroke="#7c9eb0" stroke-width="2"/><text x="877" y="320" fill="#e5edf2" font-size="26" font-weight="700" text-anchor="middle">FULL REPLAY</text><text x="877" y="350" fill="#a8c0cd" font-size="14" text-anchor="middle">像素 / Buffer 内容 / Timing / 实验</text><g fill="#88aabd"><rect x="695" y="390" width="80" height="45" rx="7"/><rect x="795" y="390" width="80" height="45" rx="7"/><rect x="895" y="390" width="80" height="45" rx="7"/><rect x="995" y="390" width="65" height="45" rx="7"/></g><g fill="#1e303a" font-size="13" text-anchor="middle"><text x="735" y="418">Draw</text><text x="835" y="418">Dispatch</text><text x="935" y="418">Clear</text><text x="1027" y="418">GPU</text></g><text x="877" y="470" fill="#b6cbd5" font-size="14" text-anchor="middle">执行完整 GPU 工作，提供真实资源结果</text></g><path d="M560 388H640" stroke="#a6b9b8" stroke-width="3" stroke-dasharray="7 7"/><path d="M624 378L640 388L624 398" fill="none" stroke="#a6b9b8" stroke-width="3"/><text x="600" y="555" fill="#9fb0b7" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" text-anchor="middle">先回答状态问题；只有需要真实 GPU 内容时，才执行完整回放</text><text x="77" y="592" fill="#8298a2" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">INSPECT THE STATE FIRST. REPLAY THE GPU WHEN IT MATTERS.</text></svg>