<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" role="img" aria-labelledby="t d"><title id="t">同一个域名，两种 DNS 观察</title><desc id="d">NAS 查询路由器 DNS 成功，但 M1 直接访问公共 DNS，只有定向观测才发现不一致</desc><style>text{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;fill:#1d1d1f}.label{font-weight:700;font-size:22px}.sub{font-size:17px;fill:#687285}.line{stroke-width:3;fill:none;stroke-linecap:round}</style><rect width="1080" height="450" rx="25" fill="#f6f9fc"/><text x="42" y="54" font-size="29" font-weight="700">解析正确 ≠ 设备正在使用这份解析</text><rect x="42" y="94" width="485" height="289" rx="20" fill="white" stroke="#d5dfeb"/><rect x="553" y="94" width="485" height="289" rx="20" fill="white" stroke="#d5dfeb"/><text x="70" y="136" class="label">观察 A：NAS 测试</text><text x="581" y="136" class="label">观察 B：设备抓包</text><text x="70" y="183">NAS → 路由器 DNS</text><text x="581" y="183">M1 → 公共 DNS</text><text x="70" y="230" class="sub">查询原厂域名</text><text x="581" y="230" class="sub">查询同一个域名</text><path class="line" stroke="#238a60" d="M80 259H466"/><path class="line" stroke="#d85d53" d="M592 259H976"/><text x="70" y="301" fill="#238a60" font-size="20" font-weight="700">本地 DNS 返回正确</text><text x="581" y="301" fill="#d85d53" font-size="20" font-weight="700">绕过路由器 DNS</text><text x="70" y="345" class="sub">无法证明 M1 解析结果</text><text x="581" y="345" class="sub">解释为何服务器收不到连接</text><text x="44" y="418" class="sub">概念示意，不包含家庭网络地址、MAC 或原始数据包</text></svg>