<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Tailscale 控制面与数据面分离</title><desc id="desc">两端设备从 Headscale 获取配置，通过本地或公网候选地址尝试 UDP 直连，失败后可以走 DERP 中继。</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf4fd"/></linearGradient><marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="none" stroke="#0071e3" stroke-width="1.4"/></marker><marker id="gray" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L9 4L0 8" fill="none" stroke="#a6b3c3" stroke-width="1.4"/></marker></defs>
<rect width="1200" height="560" rx="22" fill="url(#bg)"/><g fill="none" stroke="#e1e9f4" stroke-width="1"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
<text x="50" y="52" fill="#0071e3" font-size="18" font-weight="700">TAILSCALE / HEADSCALE</text><text x="50" y="79" fill="#6e6e73" font-size="14">控制面、直连数据面与中继回退</text>
<g><rect x="465" y="105" width="270" height="105" rx="22" fill="#fff" stroke="#c5d4e6" stroke-width="2"/><rect x="483" y="122" width="54" height="54" rx="14" fill="#e8f2ff"/><path d="M498 143h25M498 154h25M498 165h17" stroke="#0071e3" stroke-width="3" stroke-linecap="round"/><text x="548" y="148" fill="#1d1d1f" font-size="23" font-weight="700">Headscale</text><text x="548" y="174" fill="#6e6e73" font-size="15">节点身份 / Peer 信息</text></g>
<g><rect x="65" y="270" width="285" height="150" rx="24" fill="#fff" stroke="#ccd7e4" stroke-width="2"/><rect x="86" y="291" width="65" height="65" rx="15" fill="#edf5ff"/><path d="M101 309h36v28h-36zM108 344h22" stroke="#0071e3" stroke-width="3" stroke-linecap="round" fill="none"/><text x="164" y="318" fill="#1d1d1f" font-size="24" font-weight="700">设备 A</text><text x="164" y="343" fill="#6e6e73" font-size="15">主机 / NAS</text><text x="94" y="391" fill="#0071e3" font-size="15" font-weight="600">候选 Endpoint A</text></g>
<g><rect x="850" y="270" width="285" height="150" rx="24" fill="#fff" stroke="#ccd7e4" stroke-width="2"/><rect x="872" y="291" width="65" height="65" rx="15" fill="#edf5ff"/><rect x="892" y="299" width="25" height="46" rx="5" stroke="#0071e3" stroke-width="3" fill="none"/><circle cx="904" cy="339" r="2" fill="#0071e3"/><text x="951" y="318" fill="#1d1d1f" font-size="24" font-weight="700">设备 B</text><text x="951" y="343" fill="#6e6e73" font-size="15">移动终端</text><text x="874" y="391" fill="#0071e3" font-size="15" font-weight="600">候选 Endpoint B</text></g>
<path d="M336 270L483 200" fill="none" stroke="#a6b3c3" stroke-width="2.7" stroke-dasharray="7 7" marker-end="url(#gray)"/>
<path d="M864 270L718 200" fill="none" stroke="#a6b3c3" stroke-width="2.7" stroke-dasharray="7 7" marker-end="url(#gray)"/>
<text x="332" y="223" fill="#6e6e73" font-size="15">注册与配置</text><text x="762" y="223" fill="#6e6e73" font-size="15">Peer / DERP Map</text>
<path d="M350 324H844" stroke="#0071e3" stroke-width="4" fill="none" marker-end="url(#blue)"/><rect x="467" y="300" width="270" height="44" rx="22" fill="#e8f2ff"/><text x="602" y="329" text-anchor="middle" font-size="19" font-weight="700" fill="#0071e3">优先：直连 UDP / WireGuard</text>
<path d="M252 420V462H463M948 420V462H737" stroke="#b5a5e4" stroke-width="2.4" stroke-dasharray="7 7" fill="none"/>
<rect x="464" y="423" width="272" height="99" rx="22" fill="#fff" stroke="#c9b9ee" stroke-width="2"/><text x="600" y="461" text-anchor="middle" font-size="23" font-weight="700" fill="#463574">DERP relay</text><text x="600" y="488" text-anchor="middle" font-size="15" fill="#6e6e73">直连失败时的中继兜底</text>
<text x="48" y="540" fill="#86868b" font-size="12">CONCEPTUAL DIAGRAM · NOT A REAL DEPLOYMENT</text>
