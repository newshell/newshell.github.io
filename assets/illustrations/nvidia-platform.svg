<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">如果没有黄仁勋，英伟达还是英伟达吗</title><desc id="desc">GPU 芯片连接 CUDA 软件、互连网络、系统和开发者生态的平台架构概念图</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#202d38"/></linearGradient><linearGradient id="chip" x2="1" y2="1"><stop stop-color="#86b88a"/><stop offset="1" stop-color="#4e8068"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter></defs><rect width="1200" height="630" fill="url(#bg)"/><g opacity=".13" stroke="#9eb6c5"><path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/></g><g font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><text x="76" y="76" fill="#9cb6a5" font-size="17" letter-spacing="4">CODIE LAB / GPU SYSTEMS</text><text x="76" y="154" fill="#f3f4ef" font-size="43" font-weight="700">如果没有黄仁勋，</text><text x="76" y="211" fill="#f3f4ef" font-size="43" font-weight="700">英伟达还是英伟达吗？</text><text x="78" y="253" fill="#aab9c2" font-size="19">一块芯片可以被追赶，一套计算平台却很难被复制</text></g><g filter="url(#shadow)"><rect x="86" y="335" width="190" height="156" rx="17" fill="url(#chip)" stroke="#b6d7b9" stroke-width="2"/><rect x="110" y="359" width="142" height="108" rx="9" fill="#1d332c" stroke="#c0ddc1"/><g fill="#a9d0ac"><path d="M127 376h28v28h-28zM164 376h28v28h-28zM201 376h28v28h-28zM127 414h28v28h-28zM164 414h28v28h-28zM201 414h28v28h-28z"/></g><text x="181" y="518" fill="#dce8dc" text-anchor="middle" font-size="15">GPU / COMPUTE</text></g><g fill="none" stroke="#85b998" stroke-width="3"><path d="M278 413H355V350H405M355 413V466H405M355 413H405"/></g><g filter="url(#shadow)" font-family="Arial,PingFang SC,Microsoft YaHei,sans-serif"><rect x="405" y="313" width="220" height="76" rx="