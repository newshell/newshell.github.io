name: Validate public blog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_site.py
